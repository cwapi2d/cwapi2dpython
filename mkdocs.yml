site_name: Cadwork 2D Python Documentation

repo_name: cwapi2d/cwapi2dpython
repo_url: https://github.com/cwapi2d/cwapi2dpython

copyright: Copyright 2026 Cadwork

site_url: https://cwapi2d.github.io/cwapi2dpython/

theme:
  name: material
  logo: cw_logo.svg
  favicon: cw_logo.svg
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - navigation.tabs
    - content.code.copy

nav:
  - Home: index.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cwapi2d
      name: cwapi2d
